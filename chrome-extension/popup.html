<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #161f30;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 360px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .logo { font-weight: 700; font-size: 15px; background: linear-gradient(135deg, #a5b4fc, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .status-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .thumb-wrapper {
      position: relative;
      width: 100%;
      height: 160px;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .thumb-wrapper img, .thumb-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .duration {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.75);
      padding: 2px 6px;
      font-size: 11px;
      border-radius: 4px;
    }
    .title {
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .author { color: var(--accent); font-size: 12px; margin-bottom: 10px; }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; }
    .btn-primary:hover { opacity: 0.95; }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.1); margin-top: 6px; }
    .quality-select {
      width: 100%;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      border-radius: 6px;
      margin-bottom: 10px;
      outline: none;
    }
    .progress-bar-bg {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
    .stats { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">⚡ Video Downloader</span>
    <span class="status-badge" id="statusBadge">Engine Ready</span>
  </div>

  <div id="loading" style="text-align: center; padding: 20px;">
    <div class="spinner" style="margin: 0 auto 10px auto;"></div>
    <span style="color: var(--muted);">Detecting video on tab...</span>
  </div>

  <div id="videoContainer" style="display: none;">
    <div class="card">
      <div class="thumb-wrapper" id="previewArea">
        <img id="thumbImg" src="" />
        <span class="duration" id="durationTag">00:00</span>
      </div>
      <div class="title" id="videoTitle">Title</div>
      <div class="author" id="videoAuthor">Channel</div>

      <select class="quality-select" id="qualitySelect">
        <option value="best">Best Quality (4K / 1080p)</option>
        <option value="1080p">1080p Full HD</option>
        <option value="720p">720p HD</option>
        <option value="audio">Audio Only (MP3)</option>
      </select>

      <button class="btn btn-primary" id="downloadBtn">
        ⚡ Fast Download Video
      </button>

      <div id="progressArea" style="display: none; margin-top: 10px;">
        <div class="stats">
          <span id="speedTxt">Speed: --</span>
          <span id="pctTxt">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="stats">
          <span id="etaTxt">ETA: --</span>
          <span id="stateTxt">Downloading...</span>
        </div>
      </div>
    </div>
  </div>

  <div id="errorArea" style="display: none; color: #fca5a5; background: rgba(239, 68, 68, 0.15); padding: 8px 12px; border-radius: 6px; margin-bottom: 10px;"></div>

  <button class="btn btn-secondary" id="openWebBtn">
    🌐 Open Web Dashboard (Batch Mode)
  </button>

  <script src="popup.js"></script>
</body>
</html>
